<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══ CRITICAL: Base SEO (rendered before JS hydrates — read by all bots) ═══ -->
    <title>XANZI Tech | Enterprise Software Engineering SA</title>
    <meta name="description" content="Telkom Award-winning engineers building secure, scalable platforms, stakeholder portals &amp; ESG dashboards for government and enterprise in South Africa." />
    <meta name="keywords" content="enterprise software development south africa, custom software agency pretoria, govtech software development, secure digital systems, react asp.net developers gauteng, popia compliant software, multi-tenant platform development" />
    <link rel="canonical" href="https://xanziteh.co.za/" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="XANZI Tech" />
    <meta name="language" content="en-ZA" />

    <!-- ═══ GEOGRAPHIC SIGNALS (boosts local AI search & Google Maps relevance) ═══ -->
    <meta name="geo.region" content="ZA-GP" />
    <meta name="geo.placename" content="Pretoria, Gauteng, South Africa" />
    <meta name="geo.position" content="-25.7479;28.2293" />
    <meta name="ICBM" content="-25.7479, 28.2293" />

    <!-- ═══ OPEN GRAPH (social sharing + AI content cards) ═══════════════════ -->
    <meta property="og:site_name" content="XANZI Tech" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XANZI Tech — We Engineer Secure, Scalable Digital Systems" />
    <meta property="og:description" content="Not a marketing website agency. We build multi-user platforms, stakeholder portals, ESG dashboards and GovTech systems for ambitious organisations." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://xanziteh.co.za/" />
    <meta property="og:locale" content="en_ZA" />

    <!-- ═══ TWITTER CARD ════════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@xanzitech" />
    <meta name="twitter:title" content="XANZI Tech — We Engineer Secure, Scalable Digital Systems" />
    <meta name="twitter:description" content="Award-winning software engineering agency in South Africa building secure, scalable platforms for government, education and enterprise." />
    <meta name="twitter:image" content="https://xanziteh.co.za/og-home.png" />

    <!-- ═══ SCHEMA.ORG JSON-LD — BASE ORGANIZATION (fallback for non-JS crawlers) ═══
         react-helmet-async injects the full @graph on JS hydration.
         This lightweight version ensures bots that don't execute JS still
         identify the entity, location, and core service signals.           ═══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "LocalBusiness", "ProfessionalService"],
      "@id": "https://xanziteh.co.za/#organization",
      "name": "XANZI Tech",
      "alternateName": "XANZI Technology",
      "url": "https://xanziteh.co.za",
      "description": "XANZI Tech is a Pretoria-based enterprise software engineering agency specialising in secure, scalable digital systems, multi-tenant stakeholder portals, GovTech platforms, ESG analytics dashboards, and POPIA-compliant cloud-native applications for governments, educational institutions, and corporate enterprises across South Africa and Africa.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Pretoria",
        "addressRegion": "Gauteng",
        "addressCountry": "ZA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -25.7479,
        "longitude": 28.2293
      },
      "areaServed": ["Pretoria", "Johannesburg", "Gauteng", "South Africa", "Africa"],
      "award": ["Telkom Innovation Awards 2025 — Winner", "ABSA x YEI Emerging Innovators Programme"],
      "knowsAbout": [
        "Enterprise Software Engineering",
        "GovTech Platform Development",
        "POPIA Compliance Engineering",
        "Multi-Tenant Platform Architecture",
        "Supabase Row-Level Security",
        "React ASP.NET Core Development",
        "ESG Analytics Dashboards",
        "Docker Kubernetes Deployment"
      ]
    }
    </script>

    <!-- ═══ FAVICONS & PWA ═══════════════════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ═══ FONTS ════════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
